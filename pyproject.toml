[project]
name = "hydraad"
version = "0.0.1"
authors = [
    {name = "Louis Carpentier", email = "louis.carpentier@kuleuven.be"}
]
description = "Applying the Hydra-transform for time series anomaly detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # General
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
    "python-dotenv>=1.0.0",
    "ruff>=0.14.11",
    # Project specific
    "aeon==1.3.0",
    "matplotlib==3.10.8",
    "seaborn==0.13.2",
    "dtaianomaly==0.5.1",
    "TSB_AD==1.5",
    "torch==2.10.0"
]

[project.optional-dependencies]
notebooks = [
    "ipykernel>=7.1.0",
    "jupyter"
]
test = [
    "pytest>=9.0.2",
]
docs = [
    "toml",
    "sphinx",
    "sphinx-rtd-theme",
    "numpydoc",
    "sphinxcontrib-bibtex"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[[tool.uv.index]]
# https://docs.astral.sh/uv/concepts/indexes/
name = "pytorch"  # Optional name for the index.
url = "https://download.pytorch.org/whl/cpu"  # Required URL for the index.
